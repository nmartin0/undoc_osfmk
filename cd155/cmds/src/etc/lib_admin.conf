# lib_admin.conf
#
# This file, in "attributes file" format, contains the global library
# configuration.  One entry per library, of the form:
# <library_name>:
#	install=<value>
#	preload=<value>
#
# Where <value> is "true" or "false".  Entries must be separated by one
# or more blank lines.  NOTE that the file must also end with an extra
# blank line.  Note also that library names should be complete pathnames.
#
/usr/shlib/libc.so:
	install=true
	preload=true

/usr/shlib/libld.so:
	install=true
	preload=true

